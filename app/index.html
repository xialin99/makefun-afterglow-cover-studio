<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>余晖 · 封面工作室</title>
<link rel="stylesheet" href="studio.css">
<script src="art.js" defer></script>
<script src="language.js" defer></script>
<script src="studio.js" defer></script>
<header><a class="brand" href="./index.html"><span class="mark">✳</span> AFTERGLOW <small><span data-copy="COVER STUDIO">封面工作室</span></small></a><span class="offline"><i></i> <span data-copy="OFFLINE STUDIO">离线编辑</span></span><label class="language-switch"><span class="sr-only">语言 / Language</span><select id="language"><option value="zh">简体中文</option><option value="en">English</option></select></label></header>
<main>
<section class="workspace" aria-label="封面预览" data-label="Cover preview">
  <div class="stage-head"><span>◈ &nbsp; <span data-copy="LIVE COVER">实时预览</span></span><span id="size"></span></div>
  <div class="stage"><canvas id="cover" aria-label="封面预览。选择一个画格，然后拖动调整构图。" data-label="Cover preview. Select a panel and position it by dragging."></canvas></div>
  <div class="stage-foot"><span><span data-copy="Drag on the cover to reframe a panel">拖动封面中的图片以调整构图</span></span><button id="demo"><span data-copy="Restore demo">恢复示例</span></button></div>
</section>
<aside>
  <div class="intro"><h1><span data-copy="Cover editor">封面编辑器</span></h1><p><span data-copy="Turn your photos into a neon-noir poster.">用你的照片制作霓虹风格海报。</span></p></div>
  <section class="controls"><h2><span data-copy="Panels">画格</span></h2><div id="panels"></div>
  <input id="file" type="file" accept="image/*" hidden>
  <div class="actions"><button id="replace">↑ &nbsp; <span data-copy="Replace photo">更换图片</span></button><button id="duplicate"><span data-copy="Use in all panels">用于全部画格</span></button></div>
  <label class="row" for="zoom"><span data-copy="Zoom">缩放</span> <output id="zoomValue"></output></label>
  <input id="zoom" type="range" min="1" max="4" step=".01" value="1">
  <button class="subtle" id="reset"><span data-copy="Reset framing">重置构图</span></button>
  </section>
  <section class="controls"><label class="row caption" for="caption"><span data-copy="Caption">封面文字</span></label><input id="caption" maxlength="48" value="暮色疾行">
  <h2><span data-copy="Color grade">色调</span></h2><div id="grades"></div></section>
  <section class="controls"><h2><span data-copy="Export format">导出尺寸</span></h2><div id="formats"></div>
  <button id="download">↓ &nbsp; <span data-copy="Download PNG">下载 PNG</span></button>
  <p id="status" role="status" aria-live="polite"><span data-copy="Photos stay on this device.">照片只保存在此设备上。</span></p></section>
</aside>
</main>
</html>
