<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterglow — Cover Studio</title>
<link rel="stylesheet" href="studio.css">
<script src="art.js" defer></script>
<script src="studio.js" defer></script>
<header><a class="brand" href="./index.html"><span class="mark">✳</span> AFTERGLOW <small>COVER STUDIO</small></a><span class="offline"><i></i> OFFLINE STUDIO</span></header>
<main>
<section class="workspace" aria-label="Cover preview">
  <div class="stage-head"><span>◈ &nbsp; LIVE COVER</span><span id="size"></span></div>
  <div class="stage"><canvas id="cover" aria-label="Cover preview. Select a panel and position it by dragging."></canvas></div>
  <div class="stage-foot"><span>Drag on the cover to reframe a panel</span><button id="demo">Restore demo</button></div>
</section>
<aside>
  <div class="intro"><h1>Cover editor</h1><p>Turn your photos into a neon-noir poster.</p></div>
  <section class="controls"><h2>Panels</h2><div id="panels"></div>
  <input id="file" type="file" accept="image/*" hidden>
  <div class="actions"><button id="replace">↑ &nbsp; Replace photo</button><button id="duplicate">Use in all panels</button></div>
  <label class="row" for="zoom">Zoom <output id="zoomValue"></output></label>
  <input id="zoom" type="range" min="1" max="4" step=".01" value="1">
  <button class="subtle" id="reset">Reset framing</button>
  </section>
  <section class="controls"><label class="row caption" for="caption">Caption</label><input id="caption" maxlength="48" value="DUSK RUN">
  <h2>Color grade</h2><div id="grades"></div></section>
  <section class="controls"><h2>Export format</h2><div id="formats"></div>
  <button id="download">↓ &nbsp; Download PNG</button>
  <p id="status" role="status" aria-live="polite">Photos stay on this device.</p></section>
</aside>
</main>
</html>
